- name: Install Python runtime
  ansible.builtin.apt:
    name: [python3, python3-venv]
    state: present
    update_cache: true

- name: Create app directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory

- name: Copy built wheel to host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../dist/{{ wheel_file }}"
    dest: "{{ app_dir }}/{{ wheel_file }}"
  register: wheel
  notify: Restart cloudpulse

- name: Install wheel into virtualenv
  ansible.builtin.pip:
    name: "{{ app_dir }}/{{ wheel_file }}"
    virtualenv: "{{ app_dir }}/venv"
    virtualenv_command: python3 -m venv
    # same version number, so force a reinstall only when a new wheel was copied
    state: "{{ 'forcereinstall' if wheel.changed else 'present' }}"

- name: Install systemd service
  ansible.builtin.template:
    src: cloudpulse.service.j2
    dest: /etc/systemd/system/cloudpulse.service
  notify: Restart cloudpulse

- name: Enable and start service
  ansible.builtin.systemd:
    name: cloudpulse
    enabled: true
    state: started
    daemon_reload: true
